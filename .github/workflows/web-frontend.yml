name: Web Frontend

# Checks that loom --web's frontend (loom/web/frontend) is formatted and builds, and that
# the committed build (loom/web/static), which installs ship, is the build of the source.

on:
  workflow_dispatch:
  push:
    paths:
      - 'loom/web/frontend/**'
      - 'loom/web/static/**'
      - '.github/workflows/web-frontend.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'loom/web/frontend/**'
      - 'loom/web/static/**'
      - '.github/workflows/web-frontend.yml'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loom/web/frontend

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: loom/web/frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Check formatting
      run: npm run format:check

    - name: Type-check and build
      run: npm run build

    - name: Check the committed build is up to date
      working-directory: .
      run: |
        if [ -n "$(git status --porcelain -- loom/web/static)" ]; then
          git status --short -- loom/web/static
          echo "loom/web/static doesn't match the frontend's source: run npm run build in"
          echo "loom/web/frontend and commit loom/web/static."
          exit 1
        fi
