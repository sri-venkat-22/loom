name: Docker Release

# Manual for now: run it from the Actions tab (on a vX.Y.Z tag) to publish images to
# ghcr.io/sri-venkat-22/loom and ghcr.io/sri-venkat-22/loom-full.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker_build_and_push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build and push Docker images
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/sri-venkat-22/loom:${{ github.ref_name }}
          ghcr.io/sri-venkat-22/loom:latest
        target: loom

    - name: Build and push Docker full image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ghcr.io/sri-venkat-22/loom-full:${{ github.ref_name }}
          ghcr.io/sri-venkat-22/loom-full:latest
        target: loom-full
