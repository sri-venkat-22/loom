name: GitHub Release

# loom is distributed from GitHub, not PyPI (the "loom" name on PyPI is an unrelated
# project). Pushing a vX.Y.Z tag builds the sdist and wheel and publishes them as a
# GitHub Release, which is what `loom --check-update` compares against.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x

    - name: Build
      run: |
        python -m pip install --upgrade pip
        pip install build
        python -m build

    - name: Check version matches tag
      run: |
        ls dist
        test -f "dist/loom-${GITHUB_REF_NAME#v}-py3-none-any.whl"

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" dist/* \
          --title "loom $GITHUB_REF_NAME" \
          --generate-notes \
          --verify-tag
