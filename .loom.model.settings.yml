# Model settings for three test models. Set the matching env var (see below), then:
#   loom --model <name>
#
# Env vars:
#   OpenRouter :  export OPENROUTER_API_KEY=...
#   NVIDIA NIM :  export NVIDIA_NIM_API_KEY=...
#   Gemini     :  export GEMINI_API_KEY=...

# OpenRouter — NVIDIA Nemotron 3 Ultra (free tier).
# NOTE: verify the exact slug at openrouter.ai/models (free models end in ":free").
- name: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
  edit_format: whole

# NVIDIA NIM — deepseek-v4-flash, with the "thinking" chat-template kwargs from the snippet.
- name: nvidia_nim/deepseek-ai/deepseek-v4-flash-0731
  edit_format: whole
  use_temperature: 1.0
  extra_params:
    top_p: 0.95
    max_tokens: 16384
    extra_body:
      chat_template_kwargs:
        thinking: true
        reasoning_effort: high

# Gemini — pick any Gemini model; 2.5 Pro shown.
- name: gemini/gemini-3.1-pro-preview
  edit_format: diff
