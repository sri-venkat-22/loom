
[project]
name = "loom"
description = "Loom is AI pair programming in your terminal"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python",
    "Topic :: Software Development",
]
requires-python = ">=3.10,<3.15"
dynamic = ["dependencies", "optional-dependencies", "version"]

[project.urls]
Homepage = "https://github.com/sri-venkat-22/loom"

[project.scripts]
loom = "loom.main:main"

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }

[tool.setuptools.dynamic.optional-dependencies]
dev = { file = "requirements/requirements-dev.txt" }
help = { file = "requirements/requirements-help.txt" }
playwright = { file = "requirements/requirements-playwright.txt" }
memory = { file = "requirements/requirements-memory.txt" }
web = { file = "requirements/requirements-web.txt" }

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["loom"]

[tool.setuptools.exclude-package-data]
# loom --web ships its built frontend (loom/web/static), not the sources, and the docs'
# screenshots are for GitHub
loom = ["web/frontend/*", "web/frontend/**/*", "docs/images/*"]

[build-system]
requires = ["setuptools>=68", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "loom/_version.py"

[tool.codespell]
skip = "*.svg,tests/fixtures/*,*/package-lock.json,*/web/static/*"
write-changes = true
# ChromaDB's $nin ("not in") filter operator
ignore-words-list = "nin"
